name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Sent by the CMS a minute after content changes, so pre-rendered pages stay current.
  repository_dispatch:
    types: [cms-content-changed]

permissions:
  contents: read

concurrency:
  group: neutorium-site-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        env:
          # Repository variable, e.g. https://cms.neutorium.com. Empty = built-in content.
          CMS_URL: ${{ vars.CMS_URL }}
          VITE_CMS_URL: ${{ vars.CMS_URL }}
          # Optional HTML-tag verification for Google Search Console / Bing Webmaster Tools.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.NEUTORIUM_SITE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '187.53.130.231 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBeHmD2n1lIdhXC65IaK9DlavnrVsC5P1vM1pEJt7A1v' >> ~/.ssh/known_hosts
          # The server-side forced command (deploy/receive-release.sh) unpacks
          # stdin into a new release and swaps the live symlink.
          tar -C dist -czf - . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            neutorium-deploy@187.53.130.231 "$GITHUB_SHA"

      - name: Verify live site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          expected=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          for i in $(seq 1 10); do
            if curl -fsS https://neutorium.com/ | grep -q "$expected"; then
              echo "Live site serves $expected"; exit 0
            fi
            sleep 3
          done
          echo "neutorium.com is not serving the new build ($expected)" >&2
          exit 1

      # Tell IndexNow engines (Bing, Yandex, Seznam, Naver; Bing feeds ChatGPT search and Copilot)
      # that the site changed. The key file is public/88ba80cc11e5a2ecd915ffc667fa5dc7.txt.
      - name: Notify IndexNow
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          key=88ba80cc11e5a2ecd915ffc667fa5dc7
          urls=$(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          jq -n --arg key "$key" --argjson urls "$urls" \
            '{host: "neutorium.com", key: $key, keyLocation: ("https://neutorium.com/" + $key + ".txt"), urlList: $urls}' \
            | curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' -d @-
