# Neutorium CMS on the VPS. Copy to the server (e.g. /opt/neutorium-cms/compose.yml),
# create .env next to it from cms/.env.example, then: docker compose up -d --build
# It is served on the main domain: the neutorium-site Caddy (deploy/site.Caddyfile) proxies
# /addme, /admin and /api to neutorium-cms:1337, so both containers must share a network.
services:
  neutorium-cms:
    build: ../cms
    container_name: neutorium-cms
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: neutorium-cms-db
      DATABASE_PORT: 5432
      PUBLIC_URL: https://neutorium.com
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - neutorium-cms-db
    networks: [default, site]

  neutorium-cms-db:
    image: postgres:16-alpine
    container_name: neutorium-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-neutorium_cms}
      POSTGRES_USER: ${DATABASE_USERNAME:-neutorium}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  uploads:
  db:

networks:
  # The Docker network the neutorium-site container is on; adjust the name to match the server.
  site:
    external: true
